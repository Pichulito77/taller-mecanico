<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Taller PG</title>
	<style>
		body{font-family:Arial, sans-serif;margin:24px;color:#222}
		h1{margin-bottom:8px}
		.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
		.card{border:1px solid #ddd;border-radius:8px;padding:16px;cursor:pointer;transition:.15s}
		.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
		.card a{text-decoration:none;color:inherit;display:block}
		.small{color:#666;font-size:13px}
		.header{display:flex;justify-content:space-between;align-items:center}
		.btn{background:#0b5ed7;color:#fff;border:none;border-radius:6px;padding:10px 14px;cursor:pointer}
	</style>
</head>
<body>
	<div class="header">
		<h1>Taller PG</h1>
		<button class="btn" onclick="location.href='/admin/'">Ir al Admin</button>
	</div>
	<p class="small">Accesos rápidos</p>
	<div class="grid">
		<div class="card"><a href="/admin/customers/cliente/add/">Nuevo cliente</a></div>
		<div class="card"><a href="/admin/customers/vehiculo/add/">Nuevo vehículo</a></div>
		<div class="card"><a href="/admin/inventory/part/add/">Nuevo repuesto</a></div>
		<div class="card"><a href="/admin/workorders/workorder/add/">Nueva OT</a></div>
		<div class="card"><a href="/api/ot/?ordering=-id&page_size=1" target="_blank">Última OT (API)</a></div>
		<div class="card"><a href="/health/" target="_blank">Salud del sistema</a></div>
	</div>
</body>
</html>
