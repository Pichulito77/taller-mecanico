{% extends 'base.html' %}
{% block title %}Inicio · Taller PG{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
	<h2 class="m-0">Inicio</h2>
	<a class="btn btn-primary" href="/admin/workorders/workorder/add/"><i class="bi bi-plus-lg me-1"></i>Nueva Orden</a>
</div>
<div class="row g-3 mb-3">
	<div class="col-md-3"><div class="card p-3"><div class="d-flex align-items-center gap-2"><i class="bi bi-tools fs-4 text-primary"></i><div><div class="text-secondary small">Órdenes activas</div><div class="fs-4 fw-semibold" id="kpiOt">—</div></div></div></div></div>
	<div class="col-md-3"><div class="card p-3"><div class="d-flex align-items-center gap-2"><i class="bi bi-people fs-4 text-primary"></i><div><div class="text-secondary small">Clientes</div><div class="fs-4 fw-semibold" id="kpiCli">—</div></div></div></div></div>
	<div class="col-md-3"><div class="card p-3"><div class="d-flex align-items-center gap-2"><i class="bi bi-car-front fs-4 text-primary"></i><div><div class="text-secondary small">Vehículos</div><div class="fs-4 fw-semibold" id="kpiVeh">—</div></div></div></div></div>
</div>
<div class="card p-3">
	<h5 class="mb-3">Accesos rápidos</h5>
	<div class="d-flex flex-wrap gap-2">
		<a class="btn btn-outline-primary" href="/admin/customers/cliente/add/"><i class="bi bi-person-plus me-1"></i>Nuevo cliente</a>
		<a class="btn btn-outline-primary" href="/admin/customers/vehiculo/add/"><i class="bi bi-car-front me-1"></i>Nuevo vehículo</a>
		<a class="btn btn-outline-primary" href="/admin/inventory/part/add/"><i class="bi bi-box-seam me-1"></i>Nuevo repuesto</a>
		<a class="btn btn-outline-primary" href="/admin/workorders/workorder/"><i class="bi bi-tools me-1"></i>Ver órdenes</a>
	</div>
</div>
{% endblock %}
{% block extra_js %}
<script>
(async function(){
	try{
		// Estos endpoints pueden requerir login; se usan solo como ejemplo visual
		const ot = await fetch('/api/ot/?ordering=-id&page_size=1'); if (ot.ok) document.getElementById('kpiOt').textContent = 'OK';
		const cli = await fetch('/admin/customers/cliente/'); if (cli.ok) document.getElementById('kpiCli').textContent = '—';
		const veh = await fetch('/admin/customers/vehiculo/'); if (veh.ok) document.getElementById('kpiVeh').textContent = '—';
	}catch(e){}
})();
</script>
{% endblock %}
