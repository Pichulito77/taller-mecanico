<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Taller PG</title>
	<style>
		:root{ --tp-primary:#0b5ed7; --tp-secondary:#6610f2; }
		body{font-family:Arial, sans-serif;margin:0;color:#222}
		.header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:linear-gradient(135deg,var(--tp-primary),var(--tp-secondary));color:#fff}
		.brand{display:flex;align-items:center;gap:10px}
		.logo{width:36px;height:36px;background:#fff;border-radius:8px}
		h1{margin:0;font-size:20px;letter-spacing:.5px}
		.container{padding:20px 24px}
		.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
		.card{border:1px solid #ddd;border-radius:10px;padding:16px;cursor:pointer;transition:.15s}
		.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
		.card a{text-decoration:none;color:inherit;display:block}
		.small{color:#666;font-size:13px}
		.btn{background:#fff;color:#222;border:none;border-radius:8px;padding:10px 14px;cursor:pointer}
	</style>
</head>

	</div>
	<div class="container">

			<div class="card"><a href="/health/" target="_blank">Salud del sistema</a></div>
		</div>
	</div>
</body>
